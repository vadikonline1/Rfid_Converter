name: Build EXE

# Compileaza automat RfidConverter.exe la fiecare push.
# - la push pe main/master: build + verificare
# - la tag v* (ex: v1.0.0): build + atasare .exe la GitHub Release
# - manual: din tab-ul Actions -> Run workflow

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # necesar pentru crearea Release-ului si atasarea .exe-ului
    permissions:
      contents: write

    steps:
      - name: Checkout cod
        uses: actions/checkout@v5

      - name: Instalare .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Compilare RfidConverter.exe (single-file)
        run: dotnet publish RfidConverter -c Release -o dist

      - name: Verificare artefact
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/RfidConverter.exe
          "RfidConverter.exe = $([math]::Round($exe.Length/1MB,1)) MB"
          if ($exe.Length -lt 50MB) { throw "Artefact suspect de mic!" }

      # Creeaza Release-ul (daca nu exista) si ataseaza .exe-ul,
      # folosind GitHub CLI preinstalat pe runner (fara actiuni externe).
      - name: Atasare .exe la Release (doar la tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view "$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create "$tag" --title "$tag" --generate-notes }
          gh release upload "$tag" dist/RfidConverter.exe --clobber
