name: Build EXE

# Compileaza automat RfidConverter.exe la fiecare push.
# - la push pe main/master: build + verificare
# - la tag v* (ex: v1.0.0): build + atasare .exe la GitHub Release
# - manual: din tab-ul Actions -> Run workflow

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # necesar pentru crearea Release-ului si atasarea .exe-ului
    permissions:
      contents: write
    # certificatul de semnare (gol = pasul de semnare e sarit)
    env:
      CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
      CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}

    steps:
      - name: Checkout cod
        uses: actions/checkout@v5

      - name: Instalare .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Versiunea release-ului (v1.2.3 -> 1.2.3) ajunge in metadatele .exe-ului
      - name: Versiune din tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Add-Content $env:GITHUB_ENV "APP_VERSION=$($tag.TrimStart('v'))"

      - name: Compilare RfidConverter.exe (single-file)
        shell: pwsh
        run: |
          $ver = if ($env:APP_VERSION) { $env:APP_VERSION } else { '1.0.0' }
          dotnet publish RfidConverter -c Release -o dist /p:Version=$ver

      - name: Verificare artefact
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/RfidConverter.exe
          "RfidConverter.exe = $([math]::Round($exe.Length/1MB,1)) MB"
          "Versiune fisier    = $($exe.VersionInfo.FileVersion)"
          if ($exe.Length -lt 50MB) { throw "Artefact suspect de mic!" }

      # Semnatura Authenticode (SmartScreen): ruleaza doar daca exista
      # secretele CERT_PFX_BASE64 + CERT_PASSWORD (certificat cumparat OV/EV).
      # Fara certificat, pasul e sarit si .exe-ul ramane nesemnat.
      - name: Semnare Authenticode (doar cu certificat)
        if: env.CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist/RfidConverter.exe
          if ($LASTEXITCODE -ne 0) { throw "Semnarea a esuat!" }
          & $signtool verify /pa dist/RfidConverter.exe
          Remove-Item $pfx -Force

      # Creeaza Release-ul (daca nu exista) si ataseaza .exe-ul,
      # folosind GitHub CLI preinstalat pe runner (fara actiuni externe).
      - name: Atasare .exe la Release (doar la tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view "$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create "$tag" --title "$tag" --generate-notes }
          gh release upload "$tag" dist/RfidConverter.exe --clobber
